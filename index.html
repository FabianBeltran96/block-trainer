<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block Trainer</title>
  </head>
  <body>
    <header class="top">
      <h1>Block Trainer</h1>
      <span class="mode-tag">Finesse drill</span>
      <span id="mode-status" class="mode-status"></span>
    </header>
    <main class="layout">
      <section class="play">
        <div id="feedback" class="feedback" aria-live="polite"></div>
        <div id="board-wrap" class="board-wrap">
          <canvas id="board" aria-label="Playfield"></canvas>
        </div>
        <div id="replay-viewer" class="replay-viewer" hidden></div>
        <p id="keys-hint" class="keys"></p>
      </section>
      <aside class="sidebar">
        <section id="stats" class="panel compact"></section>
        <nav id="sidebar-tabs" class="sidebar-tabs" role="tablist" aria-label="Panels"></nav>
        <div class="sidebar-body">
          <section id="training" class="panel" data-pane="Training"></section>
          <section id="settings" class="panel" data-pane="Handling"></section>
          <section id="controls" class="panel" data-pane="Controls"></section>
          <section id="history" class="panel" data-pane="History"></section>
          <section id="replays" class="panel" data-pane="Replays"></section>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
